name: Sync upstream Khala release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [khala-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: khala-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync latest upstream release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/sync-upstream.mjs
          if git diff --quiet -- vendor/khala/khala vendor/khala/upstream.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            node -e "const p=require('./vendor/khala/upstream.json'); console.log('version='+p.version); console.log('short_sha='+p.commit.slice(0,7))" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate vendored files
        if: steps.sync.outputs.changed == 'true'
        run: node scripts/check.mjs
      - name: Test
        if: steps.sync.outputs.changed == 'true'
        run: npm test
      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          SHORT_SHA: ${{ steps.sync.outputs.short_sha }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/khala/khala vendor/khala/upstream.json
          git commit -m "chore: vendor Khala ${VERSION} (${SHORT_SHA})"
          git push origin HEAD:main
      - name: Start main CI for marketplace hand-off
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
