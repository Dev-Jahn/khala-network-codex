name: Validate and publish marketplace pin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khala-codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - run: npm test

  marketplace:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure marketplace deploy key
        env:
          DEPLOY_KEY: ${{ secrets.CODEX_MARKETPLACE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Update exact plugin commit in marketplace
        env:
          NEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone git@github.com:Dev-Jahn/jahns-codex-marketplace.git /tmp/marketplace
          node scripts/pin-marketplace.mjs /tmp/marketplace "$NEW_SHA"
          cd /tmp/marketplace
          if git diff --quiet; then exit 0; fi
          git config user.name khala-codex-ci
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/plugins/marketplace.json
          git commit -m "chore(khala): sync Codex plugin at ${NEW_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main
